name: Deploy proxmox-control-panel

on:
  workflow_run:
    workflows:
      - Build and push proxmox-control-panel image
    types:
      - completed
    branches:
      - develop
  workflow_dispatch:

concurrency:
  group: deploy-proxmox-control-panel-production
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    name: Deploy to LXC 126
    runs-on:
      - self-hosted
      - Linux
      - X64
      - proxmox-control-panel-deploy
    timeout-minutes: 20

    steps:
      - name: Trigger internal deploy
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i /home/actions/.ssh/id_ed25519_proxmox-control-panel_deploy \
            -o BatchMode=yes \
            -o RequestTTY=no \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            deployer@${{ vars.DEPLOY_HOST || '10.10.10.126' }} \
            'sudo /usr/local/bin/deploy-proxmox-control-panel.sh'
