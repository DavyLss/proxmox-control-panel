name: Auto-delete lovable-fallback branch

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  delete_branch:
    if: github.event.ref_type == 'branch' && github.event.ref == 'lovable-fallback'
    runs-on: ubuntu-latest
    steps:
      - name: Delete lovable-fallback ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -sS -X DELETE \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/git/refs/heads/lovable-fallback"
